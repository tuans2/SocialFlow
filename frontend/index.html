        // ── Media Library ────────────────────────────────────────────────
        // Everything the app generates or the user uploads lands in the assets
        // inventory. These components are the way to see it and reuse it.

        const ASSET_ICON = { image: '🖼️', video: '🎬', audio: '🎵', carousel: '🎠', document: '📄' };

        function prettyBytes(n) {
            if (!n) return '';
            const u = ['B', 'KB', 'MB', 'GB'];
            let i = 0, v = n;
            while (v >= 1024 && i < u.length - 1) { v /= 1024; i++; }
            return `${v.toFixed(v >= 10 || i === 0 ? 0 : 1)} ${u[i]}`;
        }

        function useAssets(initial) {
            const [items, setItems] = useState([]);
            const [total, setTotal] = useState(0);
            const [loading, setLoading] = useState(true);
            const [filters, setFilters] = useState(initial || {});

            const load = React.useCallback(async () => {
                setLoading(true);
                try {
                    const qs = new URLSearchParams();
                    Object.entries(filters).forEach(([k, v]) => { if (v) qs.set(k, v); });
                    qs.set('limit', '100');
                    const res = await api.get(`/assets?${qs.toString()}`);
                    setItems(res.assets || []);
                    setTotal(res.total || 0);
                } catch (e) {
                    setItems([]); setTotal(0);
                }
                setLoading(false);
            }, [JSON.stringify(filters)]);

            useEffect(() => { load(); }, [load]);
            return { items, total, loading, filters, setFilters, reload: load };
        }

        function AssetTile({ asset, order, onClick }) {
            const src = asset.thumb_url || (asset.asset_type === 'image' ? asset.url : null);
            return (
                <div className={`asset-tile ${order ? 'selected' : ''}`} onClick={onClick} title={asset.title || ''}>
                    <div className="asset-badge">{asset.asset_type}</div>
                    {order ? <div className="asset-order">{order}</div> : null}
                    {src
                        ? <img className="asset-thumb" src={`http://localhost:8000${src}`} alt={asset.title || ''} loading="lazy" />
                        : <div className="asset-thumb-fallback">{ASSET_ICON[asset.asset_type] || '📦'}</div>}
                    <div className="asset-meta">
                        <div className="asset-name">{asset.title || asset.asset_id}</div>
                        <div className="asset-sub">
                            {asset.origin === 'uploaded' ? '📤 uploaded' : '✨ generated'}
                            {asset.file_size ? ` · ${prettyBytes(asset.file_size)}` : ''}
                            {asset.duration_seconds ? ` · ${asset.duration_seconds}s` : ''}
                        </div>
                    </div>
                </div>
            );
        }

        function UploadDropzone({ onUploaded, accept, compact }) {
            const [dragging, setDragging] = useState(false);
            const [busy, setBusy] = useState(false);
            const [rejected, setRejected] = useState([]);
            const inputRef = React.useRef(null);

            const send = async (fileList) => {
                const files = Array.from(fileList || []);
                if (!files.length) return;
                setBusy(true); setRejected([]);
                const fd = new FormData();
                files.forEach(f => fd.append('files', f));
                try {
                    const res = await (await fetch(`${API}/assets/upload`, { method: 'POST', body: fd })).json();
                    setRejected(res.rejected || []);
                    if (onUploaded) onUploaded(res);
                } catch (e) {
                    setRejected([{ filename: 'upload', reason: String(e) }]);
                }
                setBusy(false);
                if (inputRef.current) inputRef.current.value = '';
            };

            return (
                <div>
                    <div
                        className={`dropzone ${dragging ? 'dragging' : ''}`}
                        onDragOver={e => { e.preventDefault(); setDragging(true); }}
                        onDragLeave={() => setDragging(false)}
                        onDrop={e => { e.preventDefault(); setDragging(false); send(e.dataTransfer.files); }}
                        onClick={() => inputRef.current && inputRef.current.click()}
                    >
                        {busy
                            ? <><div className="spinner" style={{ display: 'inline-block', marginRight: 8 }} />Uploading…</>
                            : compact
                                ? '📤 Drop files or click to upload'
                                : <>📤 Drop images, video or audio here — or click to choose<div style={{ fontSize: 11, marginTop: 6 }}>
                                    Identical files are recognised and stored once.
                                  </div></>}
                    </div>
                    <input ref={inputRef} type="file" multiple accept={accept} style={{ display: 'none' }}
                           onChange={e => send(e.target.files)} />
                    {rejected.length > 0 && (
                        <div className="reject-note">
                            {rejected.map((r, i) => <div key={i}>✗ <b>{r.filename}</b> — {r.reason}</div>)}
                        </div>
                    )}
                </div>
            );
        }

        function AssetFilters({ filters, setFilters, types }) {
            const kinds = types || ['image', 'video', 'audio', 'carousel'];
            return (
                <div className="filter-row">
                    <button className={`chip ${!filters.asset_type ? 'active' : ''}`}
                            onClick={() => setFilters({ ...filters, asset_type: '' })}>All</button>
                    {kinds.map(k => (
                        <button key={k} className={`chip ${filters.asset_type === k ? 'active' : ''}`}
                                onClick={() => setFilters({ ...filters, asset_type: k })}>
                            {ASSET_ICON[k]} {k}
                        </button>
                    ))}
                    <span style={{ width: 10 }} />
                    <button className={`chip ${filters.origin === 'generated' ? 'active' : ''}`}
                            onClick={() => setFilters({ ...filters, origin: filters.origin === 'generated' ? '' : 'generated' })}>
                        ✨ generated
                    </button>
                    <button className={`chip ${filters.origin === 'uploaded' ? 'active' : ''}`}
                            onClick={() => setFilters({ ...filters, origin: filters.origin === 'uploaded' ? '' : 'uploaded' })}>
                        📤 uploaded
                    </button>
                    <input className="form-input" placeholder="Search…" style={{ flex: 1, minWidth: 150, padding: '6px 10px', fontSize: 12 }}
                           value={filters.q || ''} onChange={e => setFilters({ ...filters, q: e.target.value })} />
                </div>
            );
        }

        // Reusable picker. Selection is ORDERED — the numbers on the tiles are
        // the slide order a slideshow will use, so clicking is also sequencing.
        function AssetPicker({ open, onClose, onConfirm, assetType, multiple, title }) {
            const { items, loading, filters, setFilters, reload } = useAssets({ asset_type: assetType || '' });
            const [picked, setPicked] = useState([]);

            useEffect(() => { if (open) setPicked([]); }, [open]);
            if (!open) return null;

            const toggle = (a) => {
                if (!multiple) { onConfirm([a]); onClose(); return; }
                setPicked(p => p.find(x => x.asset_id === a.asset_id)
                    ? p.filter(x => x.asset_id !== a.asset_id)
                    : [...p, a]);
            };
            const orderOf = (a) => {
                const i = picked.findIndex(x => x.asset_id === a.asset_id);
                return i === -1 ? 0 : i + 1;
            };

            return (
                <div className="modal-overlay" onClick={onClose}>
                    <div className="modal modal-wide" onClick={e => e.stopPropagation()}>
                        <div className="modal-header">
                            <div className="modal-title">{title || 'Choose from library'}</div>
                            <button className="modal-close" onClick={onClose}>✕</button>
                        </div>

                        <UploadDropzone compact onUploaded={reload} />
                        <div style={{ height: 14 }} />
                        <AssetFilters filters={filters} setFilters={setFilters} />

                        <div className="modal-scroll">
                            {loading ? <div className="loading-center"><div className="spinner" /></div>
                                : items.length === 0
                                    ? <div className="empty-state"><div className="empty-icon">📦</div>
                                        <p>Nothing here yet — generate something or upload a file.</p></div>
                                    : <div className="asset-grid">
                                        {items.map(a => (
                                            <AssetTile key={a.asset_id} asset={a} order={orderOf(a)} onClick={() => toggle(a)} />
                                        ))}
                                      </div>}
                        </div>

                        {multiple && (
                            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginTop: 18 }}>
                                <div style={{ fontSize: 12, color: 'var(--text-muted)' }}>
                                    {picked.length ? `${picked.length} selected — numbers are the order they will appear` : 'Click tiles in the order you want them'}
                                </div>
                                <div style={{ display: 'flex', gap: 10 }}>
                                    <button className="btn btn-secondary" onClick={() => setPicked([])}>Clear</button>
                                    <button className="btn btn-primary" disabled={!picked.length}
                                            onClick={() => { onConfirm(picked); onClose(); }}>
                                        Use {picked.length || ''}
                                    </button>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        function MediaLibrary() {
            const { items, total, loading, filters, setFilters, reload } = useAssets({});
            const [selected, setSelected] = useState(null);

            const remove = async (a) => {
                if (!confirm(`Remove "${a.title || a.asset_id}" from the library?\n\nThe file stays on disk and any post already using it still works.`)) return;
                await api.delete(`/assets/${a.asset_id}`);
                setSelected(null);
                reload();
            };

            return (
                <div>
                    <div className="header">
                        <h1 className="page-title">📚 Media Library</h1>
                        <div style={{ color: 'var(--text-muted)', fontSize: 13 }}>{total} item{total === 1 ? '' : 's'}</div>
                    </div>

                    <div className="grid-2" style={{ gridTemplateColumns: '2.2fr 1fr', alignItems: 'start' }}>
                        <div className="card">
                            <UploadDropzone onUploaded={reload} />
                            <div style={{ height: 18 }} />
                            <AssetFilters filters={filters} setFilters={setFilters} />

                            {loading ? <div className="loading-center"><div className="spinner" /></div>
                                : items.length === 0
                                    ? <div className="empty-state"><div className="empty-icon">📚</div>
                                        <p>Nothing matches.</p>
                                        <p style={{ fontSize: 12, color: 'var(--text-muted)', marginTop: 6 }}>
                                            Generated images and videos land here automatically.
                                        </p></div>
                                    : <div className="asset-grid">
                                        {items.map(a => (
                                            <AssetTile key={a.asset_id} asset={a}
                                                       order={selected && selected.asset_id === a.asset_id ? '•' : 0}
                                                       onClick={() => setSelected(a)} />
                                        ))}
                                      </div>}
                        </div>

                        <div className="card">
                            <div className="card-title">Details</div>
                            {!selected
                                ? <div className="empty-state"><div className="empty-icon">👆</div><p>Select an item</p></div>
                                : <div style={{ fontSize: 13 }}>
                                    {selected.asset_type === 'video'
                                        ? <video src={`http://localhost:8000${selected.url}`} controls style={{ width: '100%', borderRadius: 10 }} />
                                        : selected.asset_type === 'audio'
                                            ? <audio src={`http://localhost:8000${selected.url}`} controls style={{ width: '100%' }} />
                                            : selected.url
                                                ? <img src={`http://localhost:8000${selected.url}`} style={{ width: '100%', borderRadius: 10 }} />
                                                : <div className="asset-thumb-fallback" style={{ borderRadius: 10 }}>{ASSET_ICON[selected.asset_type]}</div>}

                                    <div style={{ marginTop: 14, lineHeight: 1.9 }}>
                                        <div style={{ fontWeight: 600 }}>{selected.title}</div>
                                        <div style={{ color: 'var(--text-muted)', fontSize: 12 }}>
                                            <div>{selected.asset_type} · {selected.origin}</div>
                                            {selected.provider && <div>engine: {selected.provider}</div>}
                                            {selected.file_size ? <div>{prettyBytes(selected.file_size)}</div> : null}
                                            {selected.duration_seconds ? <div>{selected.duration_seconds}s</div> : null}
                                            {selected.aspect_ratio ? <div>{selected.aspect_ratio}</div> : null}
                                            {selected.cost_usd != null ? <div>cost: ${Number(selected.cost_usd).toFixed(2)}</div> : null}
                                            <div>{new Date(selected.created_at + 'Z').toLocaleString()}</div>
                                        </div>
                                    </div>

                                    <div style={{ display: 'flex', gap: 8, marginTop: 16 }}>
                                        <a className="btn btn-secondary" href={`http://localhost:8000${selected.url}`}
                                           target="_blank" rel="noreferrer" style={{ flex: 1, textAlign: 'center' }}>Open</a>
                                        <button className="btn btn-secondary" onClick={() => remove(selected)}>Remove</button>
                                    </div>
                                </div>}
                        </div>
                    </div>
                </div>
            );
        }

        // Settings Page
        function Settings() {
            const [config, setConfig] = React.useState(null);
            const [videoProviders, setVideoProviders] = React.useState([]);
            const [defaultProvider, setDefaultProvider] = React.useState('');

            React.useEffect(() => {
                api.get('/video-providers').then(r => {
                    setVideoProviders(r.providers || []);
                    setDefaultProvider(r.default || '');
                }).catch(() => {});
            }, []);
            const [form, setForm] = React.useState({
                AI_PROVIDER: 'openai',
                OPENAI_API_KEY: '',
                ANTHROPIC_API_KEY: '',
                GEMINI_API_KEY: '',
                KLING_API_KEY: '',
                ZALO_APP_ID: '',
                ZALO_SECRET_KEY: '',
                ZALO_REFRESH_TOKEN: ''
            });
            const [saving, setSaving] = React.useState(false);
            const [saved, setSaved] = React.useState(false);

            React.useEffect(() => {
                api.get('/config').then(data => {
                    setConfig(data);
                    setForm(f => ({ ...f, AI_PROVIDER: data.ai_provider || 'openai' }));
                });
            }, []);

            const save = async () => {
                setSaving(true);
                const payload = { AI_PROVIDER: form.AI_PROVIDER };
                if (form.OPENAI_API_KEY) payload.OPENAI_API_KEY = form.OPENAI_API_KEY;
                if (form.ANTHROPIC_API_KEY) payload.ANTHROPIC_API_KEY = form.ANTHROPIC_API_KEY;
                if (form.GEMINI_API_KEY) payload.GEMINI_API_KEY = form.GEMINI_API_KEY;
                if (form.KLING_API_KEY) payload.KLING_API_KEY = form.KLING_API_KEY;
                if (form.ZALO_APP_ID) payload.ZALO_APP_ID = form.ZALO_APP_ID;
                if (form.ZALO_SECRET_KEY) payload.ZALO_SECRET_KEY = form.ZALO_SECRET_KEY;
                if (form.ZALO_REFRESH_TOKEN) payload.ZALO_REFRESH_TOKEN = form.ZALO_REFRESH_TOKEN;
                await api.post('/config', payload);
                const updated = await api.get('/config');
                setConfig(updated);
                setSaving(false);
                setSaved(true);
                setTimeout(() => setSaved(false), 2500);
            };

            const providers = [
                {
                    id: 'openai',
                    name: 'OpenAI',
                    model: 'GPT-4o',
                    badge: 'Paid',
                    badgeColor: '#f59e0b',
                    desc: 'Most capable. Requires a paid API key.',
                    link: 'https://platform.openai.com/api-keys',
                    keyField: 'OPENAI_API_KEY',
                    placeholder: 'sk-...',
                    configured: config?.openai_configured
                },
                {
                    id: 'anthropic',
                    name: 'Anthropic',
                    model: 'Claude Haiku',
                    badge: 'Free Trial',
                    badgeColor: '#8b5cf6',
                    desc: 'Fast & affordable. Free trial credits on sign-up.',
                    link: 'https://console.anthropic.com',
                    keyField: 'ANTHROPIC_API_KEY',
                    placeholder: 'sk-ant-...',
                    configured: config?.anthropic_configured
                },
                {
                    id: 'gemini',
                    name: 'Google Gemini',
                    model: 'Gemini 2.0 Flash',
                    badge: 'Free Tier',
                    badgeColor: '#10b981',
                    desc: 'Generous free tier. Great for getting started.',
                    link: 'https://aistudio.google.com/app/apikey',
                    keyField: 'GEMINI_API_KEY',
                    placeholder: 'AIza...',
                    configured: config?.gemini_configured
                }
            ];

            return (
                <div>
                    <div className="header">
                        <h1 className="page-title">Settings</h1>
                    </div>

                    <div className="card">
                        <div className="card-title">🤖 AI Text Provider</div>
                        <p style={{ color: 'var(--text-muted)', fontSize: '14px', marginBottom: '20px' }}>
                            Choose which AI generates your social media content. Video uses whichever
                            video provider is configured — see below.
                        </p>

                        <div style={{ display: 'flex', flexDirection: 'column', gap: '12px', marginBottom: '24px' }}>
                            {providers.map(p => (
                                <div
                                    key={p.id}
                                    onClick={() => setForm(f => ({ ...f, AI_PROVIDER: p.id }))}
                                    style={{
                                        padding: '16px',
                                        borderRadius: '12px',
                                        border: form.AI_PROVIDER === p.id ? '2px solid var(--accent)' : '1px solid var(--border)',
                                        background: form.AI_PROVIDER === p.id ? 'rgba(139,92,246,0.08)' : 'var(--bg-dark)',
                                        cursor: 'pointer',
                                        transition: 'all 0.15s'
                                    }}
                                >
                                    <div style={{ display: 'flex', alignItems: 'center', gap: '10px', marginBottom: '6px' }}>
                                        <div style={{
                                            width: '18px', height: '18px', borderRadius: '50%',
                                            border: form.AI_PROVIDER === p.id ? '5px solid var(--accent)' : '2px solid var(--border)',
                                            background: form.AI_PROVIDER === p.id ? 'var(--accent)' : 'transparent',
                                            flexShrink: 0
                                        }} />
                                        <span style={{ fontWeight: '600', fontSize: '15px' }}>{p.name}</span>
                                        <span style={{ fontSize: '12px', color: 'var(--text-muted)' }}>{p.model}</span>
                                        <span style={{
                                            marginLeft: 'auto', fontSize: '11px', fontWeight: '600',
                                            padding: '2px 8px', borderRadius: '99px',
                                            background: p.badgeColor + '22', color: p.badgeColor
                                        }}>{p.badge}</span>
                                        {p.configured && (
                                            <span style={{ fontSize: '11px', color: '#10b981' }}>● Configured</span>
                                        )}
                                    </div>
                                    <div style={{ fontSize: '13px', color: 'var(--text-muted)', marginLeft: '28px' }}>{p.desc}</div>

                                    {form.AI_PROVIDER === p.id && (
                                        <div style={{ marginTop: '14px', marginLeft: '28px' }} onClick={e => e.stopPropagation()}>
                                            <div style={{ fontSize: '12px', color: 'var(--text-muted)', marginBottom: '6px' }}>
                                                API Key — <a href={p.link} target="_blank" style={{ color: 'var(--accent)' }}>Get key ↗</a>
                                            </div>
                                            <input
                                                type="password"
                                                className="form-input"
                                                placeholder={p.configured ? '●●●●●●●● (already set — paste to update)' : p.placeholder}
                                                value={form[p.keyField]}
                                                onChange={e => setForm(f => ({ ...f, [p.keyField]: e.target.value }))}
                                                style={{ fontSize: '13px' }}
                                            />
                                        </div>
                                    )}
                                </div>
                            ))}
                        </div>

                        <button className="btn btn-primary" onClick={save} disabled={saving} style={{ minWidth: '120px' }}>
                            {saving ? <><div className="spinner" /> Saving...</> : saved ? '✅ Saved!' : '💾 Save Settings'}
                        </button>
                    </div>

                    <div className="card">
                        <div className="card-title">🎬 Video Generation</div>
                        <p style={{ color: 'var(--text-muted)', fontSize: '14px', marginBottom: '16px' }}>
                            Video providers registered on this install. "slideshow" renders locally
                            with ffmpeg and needs no key; the others need credentials. Note that
                            "credentials set" is not the same as usable — a paid API can still refuse
                            on quota or billing, which only a real generation reveals.
                        </p>

                        <div style={{ marginBottom: '20px' }}>
                            {videoProviders.length === 0
                                ? <div style={{ fontSize: '12px', color: 'var(--text-muted)' }}>Loading providers…</div>
                                : videoProviders.map(p => (
                                    <div key={p.name} style={{
                                        display: 'flex', alignItems: 'center', justifyContent: 'space-between',
                                        padding: '10px 12px', marginBottom: '8px', borderRadius: '8px',
                                        background: 'var(--bg-dark)', border: '1px solid var(--border)'
                                    }}>
                                        <div>
                                            <div style={{ fontWeight: 600, fontSize: '13px' }}>
                                                {p.label}
                                                {p.name === defaultProvider && (
                                                    <span style={{ marginLeft: '8px', fontSize: '10px', color: 'var(--accent)' }}>DEFAULT</span>
                                                )}
                                            </div>
                                            <div style={{ fontSize: '11px', color: 'var(--text-muted)' }}>
                                                {p.durations[0]}–{p.durations[p.durations.length - 1]}s · {p.aspect_ratios.join(', ')}
                                                {p.cost_per_second === 0
                                                    ? ' · free'
                                                    : p.cost_per_second != null
                                                        ? ` · $${p.cost_per_second}/s`
                                                        : ' · rate not set'}
                                            </div>
                                        </div>
                                        <span style={{ fontSize: '12px', color: p.configured ? '#10b981' : 'var(--text-muted)' }}
                                              title={p.configured && p.cost_per_second !== 0
                                                  ? 'Credentials are present. Whether the account is entitled to generate is only proven by actually running one.'
                                                  : ''}>
                                            {p.configured
                                                ? (p.cost_per_second === 0 ? '● ready' : '● credentials set')
                                                : '○ no credentials'}
                                        </span>
                                    </div>
                                ))}
                        </div>
                        <div style={{ marginBottom: '16px' }}>
                            <div style={{ fontSize: '12px', color: 'var(--text-muted)', marginBottom: '6px' }}>
                                Kling AI API Key — <a href="https://klingai.com/global/dev" target="_blank" style={{ color: 'var(--accent)' }}>Get key ↗</a>
                                {config?.kling_configured && <span style={{ marginLeft: '8px', color: '#10b981' }}>● Configured</span>}
                            </div>
                            <input
                                type="password"
                                className="form-input"
                                placeholder={config?.kling_configured ? '●●●●●●●● (already set — paste to update)' : 'your-kling-api-key'}
                                value={form.KLING_API_KEY}
                                onChange={e => setForm(f => ({ ...f, KLING_API_KEY: e.target.value }))}
                                style={{ fontSize: '13px' }}
                            />
                        </div>

                        <div style={{ borderTop: '1px solid var(--border)', paddingTop: '20px', marginTop: '20px' }}>
                            <div style={{ fontSize: '14px', fontWeight: 600, marginBottom: '12px', color: 'var(--zalo, #0068ff)' }}>💙 Zalo Official Account</div>
                            <p style={{ color: 'var(--text-muted)', fontSize: '13px', marginBottom: '12px' }}>
                                Lấy thông tin từ <a href="https://developers.zalo.me/" target="_blank" style={{ color: 'var(--accent)' }}>Zalo Developers ↗</a>
                                {config?.zalo_configured && <span style={{ marginLeft: '8px', color: '#10b981' }}>● Configured</span>}
                            </p>
                            <div style={{ marginBottom: '10px' }}>
                                <div style={{ fontSize: '12px', color: 'var(--text-muted)', marginBottom: '4px' }}>App ID</div>
                                <input type="text" className="form-input" placeholder={config?.zalo_configured ? '●●●● (already set)' : 'your-zalo-app-id'} value={form.ZALO_APP_ID} onChange={e => setForm(f => ({ ...f, ZALO_APP_ID: e.target.value }))} style={{ fontSize: '13px' }} />
                            </div>
                            <div style={{ marginBottom: '10px' }}>
                                <div style={{ fontSize: '12px', color: 'var(--text-muted)', marginBottom: '4px' }}>Secret Key</div>
                                <input type="password" className="form-input" placeholder={config?.zalo_configured ? '●●●●●●●● (already set)' : 'your-zalo-secret-key'} value={form.ZALO_SECRET_KEY} onChange={e => setForm(f => ({ ...f, ZALO_SECRET_KEY: e.target.value }))} style={{ fontSize: '13px' }} />
                            </div>
                            <div style={{ marginBottom: '10px' }}>
                                <div style={{ fontSize: '12px', color: 'var(--text-muted)', marginBottom: '4px' }}>Refresh Token</div>
                                <input type="password" className="form-input" placeholder={config?.zalo_configured ? '●●●●●●●● (already set)' : 'your-zalo-refresh-token'} value={form.ZALO_REFRESH_TOKEN} onChange={e => setForm(f => ({ ...f, ZALO_REFRESH_TOKEN: e.target.value }))} style={{ fontSize: '13px' }} />
                            </div>
                        </div>

                        <button className="btn btn-primary" onClick={save} disabled={saving} style={{ minWidth: '120px', marginTop: '20px' }}>
                            {saving ? <><div className="spinner" /> Saving...</> : saved ? '✅ Saved!' : '💾 Save Settings'}
                        </button>
                    </div>
                </div>
            );
        }

        // Accounts Page
        function Accounts({ accounts, onRefresh }) {
            const [modal, setModal] = useState(null);
            const [form, setForm] = useState({ username: '', password: '' });
            const [loading, setLoading] = useState(false);

            const saveAccount = async () => {
                if (!form.username || !form.password) return;
                setLoading(true);
                await api.post('/accounts', {
                    platform: modal,
                    username: form.username,
                    password: form.password
                });
                setModal(null);
                setForm({ username: '', password: '' });
                setLoading(false);
                onRefresh();
            };

            const login = async (platform) => {
                setLoading(true);
                const result = await api.post(`/accounts/${platform}/login`);
                alert(result.message);
                setLoading(false);
                onRefresh();
            };

            const remove = async (platform) => {
                if (confirm(`Disconnect ${platform}?`)) {
                    await api.delete(`/accounts/${platform}`);
                    onRefresh();
                }
            };

            const platforms = [
                { id: 'linkedin', name: 'LinkedIn', desc: 'Professional network' },
                { id: 'instagram', name: 'Instagram', desc: 'Photo & video sharing' },
                { id: 'twitter', name: 'X (Twitter)', desc: 'Real-time updates' },
                { id: 'facebook', name: 'Facebook', desc: 'Social network' },
                { id: 'reddit', name: 'Reddit', desc: 'Community discussions' },
                { id: 'medium', name: 'Medium', desc: 'Articles & Blogs' },
                { id: 'substack', name: 'Substack', desc: 'Newsletters' },
                { id: 'discord', name: 'Discord', desc: 'Community chat' },
                { id: 'heygen', name: 'HeyGen', desc: 'AI Video creation' },
                { id: 'beehiiv', name: 'Beehiiv', desc: 'Newsletter platform' },
                { id: 'mailerlite', name: 'MailerLite', desc: 'Email marketing' },
                { id: 'brevo', name: 'Brevo', desc: 'Email campaigns' },
                { id: 'zalo', name: 'Zalo OA', desc: 'Zalo Official Account' },
                { id: 'tiktok', name: 'TikTok', desc: 'Short-form videos' }
            ];

            return (
                <div>
                    <div className="header">
                        <h1 className="page-title">Connected Accounts</h1>
                    </div>

                    <div className="card">
                        <div className="card-title">🔐 Your Social Media Accounts</div>
                        <p style={{ color: 'var(--text-muted)', marginBottom: '24px', fontSize: '14px' }}>
                            Add your credentials to enable automated posting. All passwords are encrypted locally.
                        </p>

                        {platforms.map(p => {
                            const account = accounts.find(a => a.platform === p.id);
                            return (
                                <div key={p.id} className="account-item">
                                    <div className="account-info">
                                        <div className={`account-icon ${p.id}`}>{icons[p.id]}</div>
                                        <div>
                                            <div className="account-name">{p.name}</div>
                                            <div className={`account-status ${account?.is_logged_in ? 'connected' : ''}`}>
                                                {account ? (account.is_logged_in ? `● ${account.username}` : `○ ${account.username} (not logged in)`) : p.desc}
                                            </div>
                                        </div>
                                    </div>
                                    <div className="account-actions">
                                        {account ? (
                                            <>
                                                {!account.is_logged_in && (
                                                    <button className="btn btn-primary" onClick={() => login(p.id)} disabled={loading}>
                                                        {loading ? <div className="spinner" /> : '🔓 Login'}
                                                    </button>
                                                )}
                                                <button className="btn btn-danger" onClick={() => remove(p.id)}>Remove</button>
                                            </>
                                        ) : (
                                            <button className={`btn btn-${p.id}`} onClick={() => setModal(p.id)}>
                                                + Add Account
                                            </button>
                                        )}
                                    </div>
                                </div>
                            );
                        })}
                    </div>

                    <div className="card">
                        <div className="card-title">💡 How It Works</div>
                        <div style={{ color: 'var(--text-dim)', lineHeight: '1.8', fontSize: '14px' }}>
                            <p><strong>1. Add your credentials</strong> - Your password is encrypted and stored locally</p>
                            <p><strong>2. Click Login</strong> - A browser window opens for you to complete login</p>
                            <p><strong>3. Handle any verification</strong> - Complete 2FA or security checks if prompted</p>
                            <p><strong>4. You're connected!</strong> - The session is saved for automated posting</p>
                            <br />
                            <p style={{ color: 'var(--text-muted)' }}>
                                ⚠️ Note: Some platforms may require re-login periodically for security reasons.
                            </p>
                        </div>
                    </div>

                    {/* Add Account Modal */}
                    {modal && (
                        <div className="modal-overlay" onClick={() => setModal(null)}>
                            <div className="modal" onClick={e => e.stopPropagation()}>
                                <div className="modal-header">
                                    <h2 className="modal-title">Add {modal.charAt(0).toUpperCase() + modal.slice(1)} Account</h2>
                                    <button className="modal-close" onClick={() => setModal(null)}>✕</button>
                                </div>

                                <div className="form-group">
                                    <label className="form-label">
                                        {modal === 'twitter' ? 'Username or Email' : modal === 'instagram' ? 'Username' : 'Email'}
                                    </label>
                                    <input
                                        type="text"
                                        className="form-input"
                                        value={form.username}
                                        onChange={e => setForm({ ...form, username: e.target.value })}
                                        placeholder={modal === 'linkedin' ? 'email@example.com' : '@username'}
                                    />
                                </div>

                                <div className="form-group">
                                    <label className="form-label">Password</label>
                                    <input
                                        type="password"
                                        className="form-input"
                                        value={form.password}
                                        onChange={e => setForm({ ...form, password: e.target.value })}
                                    />
                                </div>

                                <div style={{ display: 'flex', gap: '12px', marginTop: '24px' }}>
                                    <button className="btn btn-secondary" onClick={() => setModal(null)}>Cancel</button>
                                    <button className="btn btn-primary" onClick={saveAccount} disabled={loading}>
                                        {loading ? <div className="spinner" /> : '🔒 Save & Login'}
                                    </button>
                                </div>

                                <p style={{ marginTop: '16px', fontSize: '12px', color: 'var(--text-muted)' }}>
                                    🔐 Your password is encrypted with AES-256 and stored only on your machine.
                                </p>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // Main App
        function App() {
            const [tab, setTab] = useState('dashboard');
            const [posts, setPosts] = useState([]);
            const [accounts, setAccounts] = useState([]);
            const [loading, setLoading] = useState(true);

            const load = async () => {
                try {
                    const [postsRes, accountsRes] = await Promise.all([
                        api.get('/posts'),
                        api.get('/accounts')
                    ]);
                    setPosts(postsRes.posts || []);
                    setAccounts(accountsRes.accounts || []);
                } catch (err) {
                    console.error('Failed to load:', err);
                }
                setLoading(false);
            };

            useEffect(() => { load(); }, []);

            const deletePost = async (id) => {
                if (confirm('Delete this post?')) {
                    await api.delete(`/posts/${id}`);
                    load();
                }
            };

            const publishPost = async (id) => {
                await api.post(`/posts/${id}/publish`);
                load();
            };

            if (loading) {
                return (
                    <div className="loading-center" style={{ height: '100vh' }}>
                        <div className="spinner" style={{ width: '40px', height: '40px' }} />
                        <p>Loading SocialFlow...</p>
                    </div>
                );
            }

            return (
                <div className="app">
                    <Sidebar active={tab} onChange={setTab} />
                    <main className="main">
                        {tab === 'dashboard' && <Dashboard posts={posts} accounts={accounts} />}
                        {tab === 'create' && <CreateContent onCreated={load} accounts={accounts} />}
                        {tab === 'carousel' && <CarouselMaker onCreated={load} />}
                        {tab === 'video' && <VideoMaker onCreated={load} />}
                        {tab === 'avatar' && <AvatarMaker onCreated={load} />}
                        {tab === 'library' && <MediaLibrary />}
                        {tab === 'posts' && <PostsList posts={posts} onDelete={deletePost} onPublish={publishPost} />}
                        {tab === 'accounts' && <Accounts accounts={accounts} onRefresh={load} />}
                        {tab === 'settings' && <Settings />}
                    </main>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
