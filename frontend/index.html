<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SocialFlow - AI Social Media Automation</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #09090b;
            --bg-card: #18181b;
            --bg-elevated: #27272a;
            --border: #3f3f46;
            --border-light: #52525b;
            --text: #fafafa;
            --text-dim: #a1a1aa;
            --text-muted: #71717a;
            
            --accent: #8b5cf6;
            --accent-dim: #7c3aed;
            --accent-glow: rgba(139, 92, 246, 0.4);
            
            --linkedin: #0a66c2;
            --instagram: #e4405f;
            --twitter: #000000;
            --facebook: #1877f2;
            --reddit: #ff4500;
            --medium: #000000;
            --substack: #ff6719;
            --discord: #5865F2;
            --heygen: #6B38FB;
            --beehiiv: #000000;
            --mailerlite: #00a65a;
            --brevo: #0092ff;
            --zalo: #0068ff;
            --tiktok: #000000;
            
            --success: #22c55e;
            --warning: #eab308;
            --danger: #ef4444;
            
            --radius: 12px;
            --radius-lg: 16px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg-dark);
            color: var(--text);
            min-height: 100vh;
        }

        /* Gradient background */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: 
                radial-gradient(ellipse 100% 100% at 0% 0%, rgba(139, 92, 246, 0.08), transparent 50%),
                radial-gradient(ellipse 80% 80% at 100% 100%, rgba(59, 130, 246, 0.06), transparent 50%);
            pointer-events: none;
            z-index: -1;
        }

        .app { display: flex; min-height: 100vh; }

        /* Sidebar */
        .sidebar {
            width: 280px;
            background: var(--bg-card);
            border-right: 1px solid var(--border);
            padding: 24px 16px;
            display: flex;
            flex-direction: column;
            position: fixed;
            height: 100vh;
            overflow-y: auto;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 8px 12px;
            margin-bottom: 32px;
        }

        .logo-icon {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, var(--accent) 0%, #3b82f6 100%);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            box-shadow: 0 8px 24px var(--accent-glow);
        }

        .logo h1 {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(135deg, #fff 30%, var(--accent) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-group { margin-bottom: 28px; }
        
        .nav-label {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: var(--text-muted);
            padding: 0 12px;
            margin-bottom: 10px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 14px;
            border-radius: var(--radius);
            cursor: pointer;
            color: var(--text-dim);
            transition: all 0.15s ease;
            margin-bottom: 4px;
            font-weight: 500;
        }

        .nav-item:hover {
            background: var(--bg-elevated);
            color: var(--text);
        }

        .nav-item.active {
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.15) 0%, rgba(59, 130, 246, 0.1) 100%);
            color: var(--accent);
            border: 1px solid rgba(139, 92, 246, 0.3);
        }

        .nav-icon { font-size: 20px; width: 24px; text-align: center; }

        /* Main Content */
        .main {
            flex: 1;
            margin-left: 280px;
            padding: 32px 40px;
            max-width: 1400px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
        }

        .page-title {
            font-size: 32px;
            font-weight: 700;
        }

        /* Buttons */
        .btn {
            padding: 12px 24px;
            border-radius: var(--radius);
            border: none;
            font-family: inherit;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.15s ease;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent-dim) 100%);
            color: white;
            box-shadow: 0 4px 16px var(--accent-glow);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px var(--accent-glow);
        }

        .btn-secondary {
            background: var(--bg-elevated);
            color: var(--text);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            background: var(--border);
        }

        .btn-danger {
            background: rgba(239, 68, 68, 0.15);
            color: var(--danger);
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .btn-linkedin { background: var(--linkedin); color: white; }
        .btn-instagram { background: var(--instagram); color: white; }
        .btn-twitter { background: var(--twitter); color: white; border: 1px solid var(--border); }
        .btn-facebook { background: var(--facebook); color: white; }
        .btn-reddit { background: var(--reddit); color: white; }
        .btn-medium { background: var(--medium); color: white; border: 1px solid var(--border); }
        .btn-substack { background: var(--substack); color: white; }
        .btn-discord { background: var(--discord); color: white; }
        .btn-heygen { background: var(--heygen); color: white; }
        .btn-beehiiv { background: var(--beehiiv); color: white; border: 1px solid var(--border); }
        .btn-mailerlite { background: var(--mailerlite); color: white; }
        .btn-brevo { background: var(--brevo); color: white; }
        .btn-zalo { background: var(--zalo); color: white; }
        .btn-tiktok { background: var(--tiktok); color: white; }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        /* Cards */
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 24px;
            margin-bottom: 24px;
        }

        .card-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 32px;
        }

        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 24px;
        }

        .stat-label { font-size: 13px; color: var(--text-muted); margin-bottom: 8px; }
        .stat-value { font-size: 36px; font-weight: 700; }
        .stat-sub { font-size: 12px; color: var(--success); margin-top: 6px; }

        /* Grid Layout */
        .grid-2 {
            display: grid;
            grid-template-columns: 1.5fr 1fr;
            gap: 24px;
        }

        /* Form Elements */
        .form-group { margin-bottom: 20px; }

        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-dim);
            margin-bottom: 8px;
        }

        .form-input, .form-textarea, .form-select {
            width: 100%;
            padding: 14px 16px;
            background: var(--bg-dark);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            color: var(--text);
            font-family: inherit;
            font-size: 14px;
            transition: all 0.15s ease;
        }

        .form-input:focus, .form-textarea:focus, .form-select:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .form-textarea { min-height: 120px; resize: vertical; }

        /* Platform Pills */
        .platform-pills {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }

        .platform-pill {
            flex: 1;
            padding: 16px 20px;
            border-radius: var(--radius);
            border: 2px solid var(--border);
            background: transparent;
            color: var(--text-dim);
            font-family: inherit;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.15s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .platform-pill:hover { border-color: var(--border-light); }

        .platform-pill.active.linkedin {
            border-color: var(--linkedin);
            background: rgba(10, 102, 194, 0.1);
            color: var(--linkedin);
        }

        .platform-pill.active.instagram {
            border-color: var(--instagram);
            background: rgba(228, 64, 95, 0.1);
            color: var(--instagram);
        }

        .platform-pill.active.twitter {
            border-color: var(--text);
            background: rgba(255, 255, 255, 0.05);
            color: var(--text);
        }
        .platform-pill.active.facebook { border-color: var(--facebook); color: var(--facebook); background: rgba(24, 119, 242, 0.1); }
        .platform-pill.active.reddit { border-color: var(--reddit); color: var(--reddit); background: rgba(255, 69, 0, 0.1); }
        .platform-pill.active.medium { border-color: var(--text); color: var(--text); background: rgba(255, 255, 255, 0.05); }
        .platform-pill.active.substack { border-color: var(--substack); color: var(--substack); background: rgba(255, 103, 25, 0.1); }
        .platform-pill.active.discord { border-color: var(--discord); color: var(--discord); background: rgba(88, 101, 242, 0.1); }
        .platform-pill.active.heygen { border-color: var(--heygen); color: var(--heygen); background: rgba(107, 56, 251, 0.1); }
        .platform-pill.active.beehiiv { border-color: var(--text); color: var(--text); background: rgba(255, 255, 255, 0.05); }
        .platform-pill.active.mailerlite { border-color: var(--mailerlite); color: var(--mailerlite); background: rgba(0, 166, 90, 0.1); }
        .platform-pill.active.brevo { border-color: var(--brevo); color: var(--brevo); background: rgba(0, 146, 255, 0.1); }
        .platform-pill.active.zalo { border-color: var(--zalo); color: var(--zalo); background: rgba(0, 104, 255, 0.1); }
        .platform-pill.active.tiktok { border-color: #ff0050; color: #ff0050; background: rgba(255, 0, 80, 0.1); }

        /* AI Toggle */
        .ai-toggle {
            display: flex;
            background: var(--bg-dark);
            border-radius: var(--radius);
            padding: 4px;
            margin-bottom: 20px;
        }

        .ai-btn {
            flex: 1;
            padding: 12px 16px;
            border: none;
            background: transparent;
            color: var(--text-dim);
            font-family: inherit;
            font-weight: 500;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.15s ease;
        }

        .ai-btn.active {
            background: var(--accent);
            color: white;
        }

        /* Content Type Tabs */
        .content-tabs {
            display: flex;
            gap: 4px;
            background: var(--bg-dark);
            padding: 4px;
            border-radius: var(--radius);
            margin-bottom: 20px;
        }

        .content-tab {
            flex: 1;
            padding: 10px 16px;
            border: none;
            background: transparent;
            color: var(--text-dim);
            font-family: inherit;
            font-weight: 500;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.15s ease;
            font-size: 13px;
        }

        .content-tab.active {
            background: var(--bg-elevated);
            color: var(--text);
        }

        /* Generated Content */
        .generated-content {
            background: var(--bg-dark);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px;
            white-space: pre-wrap;
            font-size: 14px;
            line-height: 1.7;
            max-height: 400px;
            overflow-y: auto;
            margin-bottom: 20px;
        }

        /* Post Item */
        .post-item {
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px;
            margin-bottom: 12px;
            transition: all 0.15s ease;
        }

        .post-item:hover { border-color: var(--border-light); }

        .post-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
        }

        .post-badges { display: flex; gap: 8px; }

        .badge {
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .badge.linkedin { background: rgba(10, 102, 194, 0.2); color: var(--linkedin); }
        .badge.instagram { background: rgba(228, 64, 95, 0.2); color: var(--instagram); }
        .badge.twitter { background: rgba(255, 255, 255, 0.1); color: var(--text); }
        .badge.facebook { background: rgba(24, 119, 242, 0.2); color: var(--facebook); }
        .badge.reddit { background: rgba(255, 69, 0, 0.2); color: var(--reddit); }
        .badge.medium { background: rgba(255, 255, 255, 0.1); color: var(--text); }
        .badge.substack { background: rgba(255, 103, 25, 0.2); color: var(--substack); }
        .badge.discord { background: rgba(88, 101, 242, 0.2); color: var(--discord); }
        .badge.heygen { background: rgba(107, 56, 251, 0.2); color: var(--heygen); }
        .badge.beehiiv { background: rgba(255, 255, 255, 0.1); color: var(--text); }
        .badge.mailerlite { background: rgba(0, 166, 90, 0.2); color: var(--mailerlite); }
        .badge.brevo { background: rgba(0, 146, 255, 0.2); color: var(--brevo); }
        .badge.zalo { background: rgba(0, 104, 255, 0.2); color: var(--zalo); }
        .badge.tiktok { background: rgba(0, 0, 0, 0.2); color: var(--tiktok); }

        .badge.draft { background: rgba(255, 255, 255, 0.1); color: var(--text-dim); }
        .badge.scheduled { background: rgba(139, 92, 246, 0.2); color: var(--accent); }
        .badge.publishing { background: rgba(234, 179, 8, 0.2); color: var(--warning); }
        .badge.published { background: rgba(34, 197, 94, 0.2); color: var(--success); }
        .badge.failed { background: rgba(239, 68, 68, 0.2); color: var(--danger); }

        .post-content {
            font-size: 14px;
            color: var(--text-dim);
            line-height: 1.6;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .post-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid var(--border);
        }

        .post-time { font-size: 12px; color: var(--text-muted); }
        .post-actions { display: flex; gap: 8px; }

        .action-btn {
            padding: 8px 14px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text-dim);
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .action-btn:hover {
            background: var(--accent);
            border-color: var(--accent);
            color: white;
        }

        .action-btn.danger:hover {
            background: var(--danger);
            border-color: var(--danger);
        }

        /* Account Item */
        .account-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px;
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            margin-bottom: 16px;
        }

        .account-info { display: flex; align-items: center; gap: 16px; }

        .account-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            color: white;
        }

        .account-icon.linkedin { background: var(--linkedin); }
        .account-icon.instagram { background: var(--instagram); }
        .account-icon.twitter { background: var(--twitter); border: 1px solid var(--border); }
        .account-icon.facebook { background: var(--facebook); }
        .account-icon.reddit { background: var(--reddit); }
        .account-icon.medium { background: var(--medium); border: 1px solid var(--border); }
        .account-icon.substack { background: var(--substack); }
        .account-icon.discord { background: var(--discord); }
        .account-icon.heygen { background: var(--heygen); }
        .account-icon.beehiiv { background: var(--beehiiv); border: 1px solid var(--border); }
        .account-icon.mailerlite { background: var(--mailerlite); }
        .account-icon.brevo { background: var(--brevo); }
        .account-icon.zalo { background: var(--zalo); }
        .account-icon.tiktok { background: var(--tiktok); }

        .account-name { font-weight: 600; font-size: 15px; }
        .account-status { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
        .account-status.connected { color: var(--success); }

        .account-actions { display: flex; gap: 10px; }

        /* Modal */
        /* ── Media library ─────────────────────────────────────────── */
        .asset-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(132px, 1fr));
            gap: 12px;
        }

        .asset-tile {
            position: relative;
            border: 1px solid var(--border);
            border-radius: 10px;
            overflow: hidden;
            background: var(--bg-dark);
            cursor: pointer;
            transition: border-color .15s, transform .15s;
        }
        .asset-tile:hover { border-color: var(--border-light); transform: translateY(-2px); }
        .asset-tile.selected { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-glow); }

        .asset-thumb {
            width: 100%;
            aspect-ratio: 1;
            object-fit: cover;
            display: block;
            background: var(--bg-elevated);
        }
        .asset-thumb-fallback {
            width: 100%;
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            background: var(--bg-elevated);
        }

        .asset-meta { padding: 7px 8px; }
        .asset-name {
            font-size: 11px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .asset-sub { font-size: 10px; color: var(--text-muted); margin-top: 2px; }

        .asset-badge {
            position: absolute;
            top: 6px; left: 6px;
            padding: 2px 6px;
            border-radius: 5px;
            font-size: 9px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .04em;
            background: rgba(0,0,0,.72);
            color: var(--text);
        }
        .asset-order {
            position: absolute;
            top: 6px; right: 6px;
            width: 21px; height: 21px;
            border-radius: 50%;
            background: var(--accent);
            color: #fff;
            font-size: 11px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .filter-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; }
        .chip {
            padding: 5px 11px;
            border-radius: 999px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text-dim);
            font-size: 12px;
            cursor: pointer;
        }
        .chip.active { border-color: var(--accent); background: rgba(139,92,246,.14); color: var(--text); }

        .dropzone {
            border: 2px dashed var(--border);
            border-radius: 12px;
            padding: 22px;
            text-align: center;
            color: var(--text-muted);
            font-size: 13px;
            cursor: pointer;
            transition: border-color .15s, background .15s;
        }
        .dropzone:hover { border-color: var(--border-light); }
        .dropzone.dragging { border-color: var(--accent); background: rgba(139,92,246,.08); color: var(--text); }

        .modal-wide { max-width: 940px; }
        .modal-scroll { max-height: 54vh; overflow-y: auto; padding-right: 4px; }

        .reject-note {
            background: rgba(239,68,68,.1);
            border: 1px solid rgba(239,68,68,.35);
            border-radius: 8px;
            padding: 8px 10px;
            font-size: 12px;
            margin-top: 10px;
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            backdrop-filter: blur(8px);
        }

        .modal {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            width: 90%;
            max-width: 500px;
            padding: 32px;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .modal-title { font-size: 22px; font-weight: 700; }

        .modal-close {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text-dim);
            cursor: pointer;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-close:hover {
            background: rgba(239, 68, 68, 0.1);
            border-color: var(--danger);
            color: var(--danger);
        }

        /* Loading Spinner */
        .spinner {
            width: 20px;
            height: 20px;
            border: 2px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .loading-center {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px;
            color: var(--text-muted);
            gap: 16px;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }

        .empty-icon { font-size: 48px; margin-bottom: 16px; }

        /* Responsive */
        @media (max-width: 1024px) {
            .grid-2 { grid-template-columns: 1fr; }
        }

        @media (max-width: 768px) {
            .sidebar { display: none; }
            .main { margin-left: 0; padding: 20px; }
            .platform-pills { flex-direction: column; }
        }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <script type="text/babel">
        const { useState, useEffect } = React;
        
        const API = 'http://localhost:8000/api';

        // API helper
        const api = {
            get: async (url) => (await fetch(`${API}${url}`)).json(),
            post: async (url, data) => (await fetch(`${API}${url}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            })).json(),
            delete: async (url) => (await fetch(`${API}${url}`, { method: 'DELETE' })).json()
        };

        // Platform icons
        const icons = {
            linkedin: '💼',
            instagram: '📸',
            twitter: '𝕏',
            facebook: '📘',
            reddit: '🤖',
            medium: '📝',
            substack: '📚',
            discord: '🎮',
            heygen: '🎥',
            beehiiv: '🐝',
            mailerlite: '✉️',
            brevo: '📧',
            zalo: '💙',
            tiktok: '🎵',
            dashboard: '📊',
            create: '✨',
            posts: '📝',
            schedule: '📅',
            accounts: '🔐',
            settings: '⚙️'
        };
        const ALL_PLATFORMS = ['linkedin', 'instagram', 'twitter', 'facebook', 'reddit', 'medium', 'substack', 'discord', 'heygen', 'beehiiv', 'mailerlite', 'brevo', 'zalo', 'tiktok'];


        // Sidebar Component
        function Sidebar({ active, onChange }) {
            const navItems = [
                { id: 'dashboard', icon: icons.dashboard, label: 'Dashboard' },
                { id: 'create', icon: icons.create, label: 'Create Content' },
                { id: 'carousel', icon: '🎠', label: 'Carousel Maker' },
                { id: 'video', icon: '🎬', label: 'Video/Reel Maker' },
                { id: 'avatar', icon: '🧑‍💼', label: 'Avatar Videos' },
                { id: 'library', icon: '📚', label: 'Media Library' },
                { id: 'posts', icon: icons.posts, label: 'All Posts' },
                { id: 'accounts', icon: icons.accounts, label: 'Accounts' },
                { id: 'settings', icon: icons.settings, label: 'Settings' },
            ];

            return (
                <aside className="sidebar">
                    <div className="logo">
                        <div className="logo-icon">⚡</div>
                        <h1>SocialFlow</h1>
                    </div>
                    
                    <nav className="nav-group">
                        <div className="nav-label">Menu</div>
                        {navItems.map(item => (
                            <div 
                                key={item.id}
                                className={`nav-item ${active === item.id ? 'active' : ''}`}
                                onClick={() => onChange(item.id)}
                            >
                                <span className="nav-icon">{item.icon}</span>
                                {item.label}
                            </div>
                        ))}
                    </nav>
                    
                    <div style={{ marginTop: 'auto', padding: '16px', borderTop: '1px solid var(--border)' }}>
                        <div style={{ fontSize: '12px', color: 'var(--text-muted)' }}>
                            🔒 Your credentials are encrypted locally
                        </div>
                    </div>
                </aside>
            );
        }

        // Dashboard
        function Dashboard({ posts, accounts }) {
            const stats = {
                total: posts.length,
                scheduled: posts.filter(p => p.status === 'scheduled').length,
                published: posts.filter(p => p.status === 'published').length,
                drafts: posts.filter(p => p.status === 'draft').length
            };

            return (
                <div>
                    <div className="header">
                        <h1 className="page-title">Dashboard</h1>
                    </div>
                    
                    <div className="stats-grid">
                        <div className="stat-card">
                            <div className="stat-label">Total Posts</div>
                            <div className="stat-value">{stats.total}</div>
                        </div>
                        <div className="stat-card">
                            <div className="stat-label">Scheduled</div>
                            <div className="stat-value">{stats.scheduled}</div>
                        </div>
                        <div className="stat-card">
                            <div className="stat-label">Published</div>
                            <div className="stat-value">{stats.published}</div>
                            <div className="stat-sub">✓ Ready to grow</div>
                        </div>
                        <div className="stat-card">
                            <div className="stat-label">Connected</div>
                            <div className="stat-value">{accounts.filter(a => a.is_logged_in).length}/3</div>
                        </div>
                    </div>

                    <div className="grid-2">
                        <div className="card">
                            <div className="card-title">📝 Recent Posts</div>
                            {posts.slice(0, 5).map(post => (
                                <PostItem key={post.id} post={post} compact />
                            ))}
                            {posts.length === 0 && (
                                <div className="empty-state">
                                    <div className="empty-icon">✨</div>
                                    <p>No posts yet. Create your first one!</p>
                                </div>
                            )}
                        </div>

                        <div className="card">
                            <div className="card-title">🔗 Accounts</div>
                            {ALL_PLATFORMS.map(platform => {
                                const account = accounts.find(a => a.platform === platform);
                                return (
                                    <div key={platform} className="account-item" style={{ padding: '14px' }}>
                                        <div className="account-info">
                                            <div className={`account-icon ${platform}`}>{icons[platform]}</div>
                                            <div>
                                                <div className="account-name" style={{ textTransform: 'capitalize' }}>{platform === 'twitter' ? 'X (Twitter)' : platform}</div>
                                                <div className={`account-status ${account?.is_logged_in ? 'connected' : ''}`}>
                                                    {account?.is_logged_in ? '● Connected' : '○ Not connected'}
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    </div>
                </div>
            );
        }

        // Create Content
        function CreateContent({ onCreated, accounts }) {
            const [platform, setPlatform] = useState('linkedin');
            const [contentType, setContentType] = useState('post');
            const [topic, setTopic] = useState('');
            const [instructions, setInstructions] = useState('');
            const [slides, setSlides] = useState(5);
            const [generated, setGenerated] = useState('');
            const [generatedImage, setGeneratedImage] = useState(null);      // browser URL, e.g. /uploads/foo.png
            const [generatedImagePath, setGeneratedImagePath] = useState(null); // filesystem path used by the publisher
            const [imageError, setImageError] = useState('');
            const [loading, setLoading] = useState(false);
            const [scheduleTime, setScheduleTime] = useState('');

            // Platform image policy — mirrors the backend quality gate (UX only, backend enforces)
            const imageRequired = ['facebook', 'instagram'].includes(platform) && contentType === 'post';

            const generate = async () => {
                if (!topic) return;
                setLoading(true);
                setGeneratedImage(null);
                setGeneratedImagePath(null);
                setImageError('');
                try {
                    const result = await api.post('/generate', {
                        topic,
                        platform,
                        content_type: contentType,
                        slides,
                        custom_instructions: instructions
                    });
                    setGenerated(result.content);
                    setGeneratedImage(result.image_url || null);
                    setGeneratedImagePath(
                        (result.media_paths && result.media_paths[0]) || result.image_path || null
                    );
                    setImageError(result.image_error || '');
                } catch (err) {
                    alert('Generation failed. Check your AI provider API key in Settings.');
                }
                setLoading(false);
            };

            const save = async (publish = false) => {
                if (!generated) return;

                if (imageRequired && !generatedImagePath) {
                    alert(
                        `${platform.charAt(0).toUpperCase() + platform.slice(1)} posts require at least one image.\n\n` +
                        'Please generate the content again so a visual is created.'
                    );
                    return;
                }

                const account = accounts.find(a => a.platform === platform);
                if (publish && !account?.is_logged_in) {
                    alert(`Please connect your ${platform} account first!`);
                    return;
                }

                try {
                    const post = await api.post('/posts', {
                        platform,
                        content_type: contentType,
                        content: generated,
                        media_paths: generatedImagePath ? [generatedImagePath] : [],
                        scheduled_time: scheduleTime || null
                    });

                    if (publish && post.id) {
                        alert('Publishing...');

                        await api.post(`/posts/${post.id}/publish`);

                        // Wait for the background publishing task.
                        let finalPost = null;
                        const maxAttempts = 60;

                        for (let attempt = 0; attempt < maxAttempts; attempt++) {
                            await new Promise(resolve => setTimeout(resolve, 2000));

                            const postsResponse = await api.get('/posts');
                            const posts = postsResponse.posts || [];
                            finalPost = posts.find(p => p.id === post.id);

                            if (finalPost?.status === 'published') {
                                alert('✅ Published successfully!');
                                break;
                            }

                            if (finalPost?.status === 'failed') {
                                throw new Error(
                                    finalPost.error_message || 'Publishing failed'
                                );
                            }
                        }

                        if (finalPost?.status === 'publishing') {
                            throw new Error(
                                'Publishing timed out. Please check the post status in Dashboard.'
                            );
                        }
                    } else {
                        alert('Saved as draft!');
                    }

                    setGenerated('');
                    setGeneratedImage(null);
                    setGeneratedImagePath(null);
                    setImageError('');
                    setTopic('');
                    onCreated();

                } catch (err) {
                    console.error('Publish error:', err);
                    alert(`❌ ${err.message || 'Publishing failed'}`);
                }
            };

            return (
                <div>
                    <div className="header">
                        <h1 className="page-title">Create Content</h1>
                    </div>

                    <div className="grid-2">
                        <div className="card">
                            <div className="card-title">✨ AI Content Generator</div>

                            <div className="form-label">Platform</div>
                            <div className="platform-pills">
                                {ALL_PLATFORMS.map(p => (
                                    <button
                                        key={p}
                                        className={`platform-pill ${platform === p ? `active ${p}` : ''}`}
                                        onClick={() => setPlatform(p)}
                                    >
                                        {icons[p]} {p === 'twitter' ? 'X' : p.charAt(0).toUpperCase() + p.slice(1)}
                                    </button>
                                ))}
                            </div>

                            <div className="form-label">Content Type</div>
                            <div className="content-tabs">
                                {['post', 'carousel', 'reel', 'thread'].map(type => (
                                    <button
                                        key={type}
                                        className={`content-tab ${contentType === type ? 'active' : ''}`}
                                        onClick={() => setContentType(type)}
                                    >
                                        {type.charAt(0).toUpperCase() + type.slice(1)}
                                    </button>
                                ))}
                            </div>

                            <div className="form-group">
                                <label className="form-label">Topic / Subject</label>
                                <input
                                    type="text"
                                    className="form-input"
                                    placeholder="e.g., 5 productivity tips for entrepreneurs"
                                    value={topic}
                                    onChange={e => setTopic(e.target.value)}
                                />
                            </div>

                            {contentType === 'carousel' && (
                                <div className="form-group">
                                    <label className="form-label">Number of Slides</label>
                                    <input
                                        type="number"
                                        className="form-input"
                                        min="3"
                                        max="10"
                                        value={slides}
                                        onChange={e => setSlides(parseInt(e.target.value))}
                                    />
                                </div>
                            )}

                            <div className="form-group">
                                <label className="form-label">Custom Instructions (Optional)</label>
                                <textarea
                                    className="form-textarea"
                                    placeholder="Add tone, style, or specific requirements..."
                                    value={instructions}
                                    onChange={e => setInstructions(e.target.value)}
                                />
                            </div>

                            <button className="btn btn-primary" onClick={generate} disabled={loading || !topic} style={{ width: '100%' }}>
                                {loading ? <><div className="spinner" /> Generating...</> : '✨ Generate Content'}
                            </button>
                        </div>

                        <div className="card">
                            <div className="card-title">📤 Preview & Publish</div>

                            {generated ? (
                                <>
                                    <div className="generated-content">{generated}</div>

                                    {generatedImage && (
                                        <div className="form-group">
                                            <label className="form-label">Generated Visual</label>
                                            <img
                                                src={`http://localhost:8000${generatedImage}`}
                                                alt="Generated visual"
                                                style={{
                                                    width: '100%',
                                                    maxWidth: '600px',
                                                    display: 'block',
                                                    borderRadius: '12px'
                                                }}
                                            />
                                        </div>
                                    )}

                                    {imageError && (
                                        <div style={{
                                            background: 'rgba(239, 68, 68, 0.12)',
                                            border: '1px solid rgba(239, 68, 68, 0.4)',
                                            color: '#ef4444',
                                            padding: '10px 12px',
                                            borderRadius: '8px',
                                            fontSize: '13px',
                                            marginBottom: '16px'
                                        }}>
                                            ⚠️ {imageError}
                                            {imageRequired && ' This post cannot be published without an image.'}
                                        </div>
                                    )}

                                    <div className="form-group">
                                        <label className="form-label">Schedule (Optional)</label>
                                        <input
                                            type="datetime-local"
                                            className="form-input"
                                            value={scheduleTime}
                                            onChange={e => setScheduleTime(e.target.value)}
                                        />
                                    </div>

                                    <div style={{ display: 'flex', gap: '12px' }}>
                                        <button
                                            className="btn btn-secondary"
                                            onClick={() => save(false)}
                                            disabled={imageRequired && !generatedImagePath}
                                        >
                                            Save Draft
                                        </button>
                                        <button
                                            className="btn btn-primary"
                                            onClick={() => save(true)}
                                            disabled={imageRequired && !generatedImagePath}
                                        >
                                            🚀 {scheduleTime ? 'Schedule' : 'Publish Now'}
                                        </button>
                                    </div>
                                </>
                            ) : (
                                <div className="empty-state">
                                    <div className="empty-icon">✨</div>
                                    <p>Generated content will appear here</p>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        // Post Item
        function PostItem({ post, onDelete, onPublish, compact }) {
            const formatDate = (d) => d ? new Date(d).toLocaleString() : '';

            return (
                <div className="post-item">
                    <div className="post-header">
                        <div className="post-badges">
                            <span className={`badge ${post.platform}`}>{post.platform}</span>
                            <span className={`badge ${post.status}`}>{post.status}</span>
                        </div>
                    </div>
                    <div className="post-content">{post.content}</div>
                    {!compact && (
                        <div className="post-footer">
                            <span className="post-time">
                                {post.scheduled_time ? `📅 ${formatDate(post.scheduled_time)}` : `Created ${formatDate(post.created_at)}`}
                            </span>
                            <div className="post-actions">
                                {post.status === 'draft' && onPublish && (
                                    <button className="action-btn" onClick={() => onPublish(post.id)}>🚀 Publish</button>
                                )}
                                {onDelete && (
                                    <button className="action-btn danger" onClick={() => onDelete(post.id)}>🗑️</button>
                                )}
                            </div>
                        </div>
                    )}
                    {post.status === 'failed' && post.error_message && (
                        <div style={{ marginTop: '12px', padding: '10px', background: 'rgba(239,68,68,0.1)', borderRadius: '8px', fontSize: '12px', color: 'var(--danger)' }}>
                            ⚠️ {post.error_message}
                        </div>
                    )}
                </div>
            );
        }

        // Posts List
        function PostsList({ posts, onDelete, onPublish }) {
            const [filter, setFilter] = useState('all');
            const filtered = filter === 'all' ? posts : posts.filter(p => p.status === filter);

            return (
                <div>
                    <div className="header">
                        <h1 className="page-title">All Posts</h1>
                    </div>

                    <div className="content-tabs" style={{ maxWidth: '500px', marginBottom: '24px' }}>
                        {['all', 'draft', 'scheduled', 'published', 'failed'].map(s => (
                            <button key={s} className={`content-tab ${filter === s ? 'active' : ''}`} onClick={() => setFilter(s)}>
                                {s.charAt(0).toUpperCase() + s.slice(1)}
                            </button>
                        ))}
                    </div>

                    <div className="card">
                        {filtered.map(post => (
                            <PostItem key={post.id} post={post} onDelete={onDelete} onPublish={onPublish} />
                        ))}
                        {filtered.length === 0 && (
                            <div className="empty-state">
                                <div className="empty-icon">📝</div>
                                <p>No posts found</p>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        // Carousel Maker
        function CarouselMaker({ onCreated }) {
            const [topic, setTopic] = useState('');
            const [slides, setSlides] = useState(5);
            const [style, setStyle] = useState('modern');
            const [platform, setPlatform] = useState('instagram');
            const [instructions, setInstructions] = useState('');
            const [loading, setLoading] = useState(false);
            const [carousel, setCarousel] = useState(null);
            const [progress, setProgress] = useState('');

            const styles = [
                { id: 'modern', label: '✨ Modern', desc: 'Clean & professional' },
                { id: 'bold', label: '🔥 Bold', desc: 'High contrast' },
                { id: 'colorful', label: '🌈 Colorful', desc: 'Vibrant colors' },
                { id: 'minimal', label: '⚪ Minimal', desc: 'Simple & elegant' },
            ];

            const generate = async () => {
                if (!topic) return;
                setLoading(true);
                setCarousel(null);
                setProgress('🧠 Generating slides...');

                try {
                    const result = await api.post('/generate-carousel', {
                        topic,
                        slides,
                        style,
                        platform,
                        custom_instructions: instructions
                    });

                    if (result.success) {
                        setCarousel(result.carousel);
                    } else {
                        alert('Failed: ' + (result.error || 'Unknown error'));
                    }
                } catch (err) {
                    alert('Generation failed. Check your AI provider API key in Settings.');
                }
                setLoading(false);
                setProgress('');
            };

            const saveCarousel = async () => {
                if (!carousel) return;
                const imagePaths = carousel.slides.filter(s => s.image_path).map(s => s.image_path);
                await api.post('/posts', {
                    platform: carousel.platform,
                    content_type: 'carousel',
                    content: carousel.caption,
                    media_paths: imagePaths
                });
                alert('Carousel saved!');
                onCreated();
            };

            return (
                <div>
                    <div className="header">
                        <h1 className="page-title">🎠 Carousel Maker</h1>
                    </div>

                    <div className="grid-2">
                        <div className="card">
                            <div className="card-title">✨ AI Carousel Generator</div>
                            <p style={{ color: 'var(--text-muted)', marginBottom: '20px', fontSize: '13px' }}>
                                Slides are generated with the image model set in Settings,
                                then saved to your Media Library.
                            </p>

                            <div className="form-label">Platform</div>
                            <div className="platform-pills" style={{ marginBottom: '20px' }}>
                                <button className={`platform-pill ${platform === 'instagram' ? 'active instagram' : ''}`} onClick={() => setPlatform('instagram')}>
                                    📸 Instagram
                                </button>
                                <button className={`platform-pill ${platform === 'linkedin' ? 'active linkedin' : ''}`} onClick={() => setPlatform('linkedin')}>
                                    💼 LinkedIn
                                </button>
                            </div>

                            <div className="form-group">
                                <label className="form-label">Topic</label>
                                <input type="text" className="form-input" placeholder="e.g., 5 habits of successful people" value={topic} onChange={e => setTopic(e.target.value)} />
                            </div>

                            <div className="form-group">
                                <label className="form-label">Slides: {slides}</label>
                                <input type="range" min="3" max="10" value={slides} onChange={e => setSlides(parseInt(e.target.value))} style={{ width: '100%' }} />
                            </div>

                            <div className="form-label">Style</div>
                            <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '8px', marginBottom: '20px' }}>
                                {styles.map(s => (
                                    <button key={s.id} onClick={() => setStyle(s.id)} style={{
                                        padding: '10px', borderRadius: '8px', cursor: 'pointer', textAlign: 'left',
                                        border: style === s.id ? '2px solid var(--accent)' : '1px solid var(--border)',
                                        background: style === s.id ? 'rgba(139,92,246,0.1)' : 'transparent', color: 'var(--text)'
                                    }}>
                                        <div style={{ fontWeight: '600', fontSize: '13px' }}>{s.label}</div>
                                        <div style={{ fontSize: '11px', color: 'var(--text-muted)' }}>{s.desc}</div>
                                    </button>
                                ))}
                            </div>

                            <div className="form-group">
                                <label className="form-label">Custom Instructions</label>
                                <textarea className="form-textarea" placeholder="Brand colors, tone, specific requirements..." value={instructions} onChange={e => setInstructions(e.target.value)} style={{ minHeight: '70px' }} />
                            </div>

                            <button className="btn btn-primary" onClick={generate} disabled={loading || !topic} style={{ width: '100%' }}>
                                {loading ? <><div className="spinner" /> {progress}</> : `🎨 Generate ${slides} Slides (~$${(slides * 0.04).toFixed(2)})`}
                            </button>
                        </div>

                        <div className="card">
                            <div className="card-title">📱 Preview</div>
                            {carousel ? (
                                <div>
                                    <div style={{ display: 'grid', gridTemplateColumns: 'repeat(2, 1fr)', gap: '10px', marginBottom: '16px' }}>
                                        {carousel.slides.map((slide, i) => (
                                            <div key={i} style={{ background: 'var(--bg-dark)', borderRadius: '8px', overflow: 'hidden', border: '1px solid var(--border)' }}>
                                                {slide.image_url ? (
                                                    <img src={`http://localhost:8000${slide.image_url}`} alt={`Slide ${i+1}`} style={{ width: '100%', aspectRatio: '1', objectFit: 'cover' }} />
                                                ) : (
                                                    <div style={{ aspectRatio: '1', display: 'flex', alignItems: 'center', justifyContent: 'center', color: 'var(--danger)', fontSize: '11px' }}>⚠️ Failed</div>
                                                )}
                                                <div style={{ padding: '8px' }}>
                                                    <div style={{ fontWeight: '600', fontSize: '11px' }}>{slide.headline}</div>
                                                    <div style={{ fontSize: '10px', color: 'var(--text-muted)' }}>{slide.body}</div>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                    <div style={{ background: 'var(--bg-dark)', padding: '10px', borderRadius: '8px', fontSize: '12px', marginBottom: '16px', whiteSpace: 'pre-wrap' }}>{carousel.caption}</div>
                                    <div style={{ display: 'flex', gap: '10px' }}>
                                        <button className="btn btn-secondary" onClick={saveCarousel}>💾 Save Draft</button>
                                        <button className="btn btn-primary" onClick={saveCarousel}>🚀 Save & Post</button>
                                    </div>
                                </div>
                            ) : (
                                <div className="empty-state">
                                    <div className="empty-icon">🎠</div>
                                    <p>Your carousel will appear here</p>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        // Video/Reel Maker
        function VideoMaker({ onCreated }) {
            const [mode, setMode] = useState('slideshow'); // slideshow, reel, text_to_video
            const [providers, setProviders] = useState([]);
            const [provider, setProvider] = useState('');
            const [slides, setSlides] = useState([]);      // ordered assets for the slideshow
            const [audioAsset, setAudioAsset] = useState(null);
            const [pickerOpen, setPickerOpen] = useState(false);

                        <div className="card">
                            <div className="card-title">📱 Preview</div>
